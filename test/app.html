<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>roe.imageEffect – Module Demo</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, 'Segoe UI', sans-serif;
      background: linear-gradient(145deg, #f1f5f9, #e2e8f0);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      padding: 2rem;
    }
    .card {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(2px);
      border-radius: 2rem;
      padding: 1.8rem 2rem;
      box-shadow: 0 20px 35px -12px rgba(0,0,0,0.2);
      width: fit-content;
      max-width: 90vw;
    }
    h1 {
      font-size: 1.8rem;
      margin: 0 0 0.3rem;
      background: linear-gradient(135deg, #1e293b, #3b82f6);
      background-clip: text;
      -webkit-background-clip: text;
      color: transparent;
    }
    .sub {
      color: #334155;
      border-left: 4px solid #3b82f6;
      padding-left: 1rem;
      margin-bottom: 1.8rem;
    }
    #island {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 2rem;
      background: #ffffffcc;
      padding: 1.5rem;
      border-radius: 1.8rem;
    }
    #island img {
      width: 220px;
      height: 165px;
      object-fit: cover;
      border-radius: 1.2rem;
      box-shadow: 0 8px 16px -8px rgba(0,0,0,0.3);
      transition: box-shadow 0.2s;
    }
    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }
    button {
      background: white;
      border: 1px solid #cbd5e1;
      padding: 0.6rem 1.4rem;
      font-weight: 550;
      border-radius: 3rem;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.95rem;
    }
    button:hover {
      background: #f8fafc;
      transform: scale(0.97);
    }
    .info {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      text-align: center;
      color: #475569;
      background: #f1f5f9;
      padding: 0.5rem;
      border-radius: 2rem;
    }
    code {
      background: #0f172a;
      color: #e2e8f0;
      padding: 0.2rem 0.5rem;
      border-radius: 12px;
    }
  </style>
</head>
<body>
<div class="card">
  <h1>📦 roe.imageEffect (ES module)</h1>
  <div class="sub">import roe from '../roe.js' • CSS transitions</div>

  <div id="island">
    <img src="https://picsum.photos/id/1015/400/300?random=1" width="220" height="165" alt="landscape">
    <img src="https://picsum.photos/id/104/400/300?random=2" width="220" height="165" alt="vintage">
    <img src="https://picsum.photos/id/169/400/300?random=3" width="220" height="165" alt="sunset">
  </div>

  <div class="button-group">
    <button id="grayscaleBtn">🌫️ Grayscale</button>
    <button id="blurBtn">🌀 Blur (3px)</button>
    <button id="resetBtn">⟳ Reset</button>
  </div>
  <div class="info">
    ⚡ duration: 0.5s (grayscale) / 0.8s (blur) • <code>roe.imageEffect('#island', {...})</code>
  </div>
</div>

<script type="module">
  // Import the roe module from parent folder (project root)
  import roe from '../roe.js';

  // Attach event handlers
  document.getElementById('grayscaleBtn').addEventListener('click', () => {
    roe.imageEffect('#island', {
      effect: 'grayscale',
      duration: 0.5,
      ease: 'cubic-bezier(0.2, 0.9, 0.4, 1.1)'
    });
  });

  document.getElementById('blurBtn').addEventListener('click', () => {
    roe.imageEffect('#island', {
      effect: 'blur',
      amount: '3px',
      duration: 0.8,
      ease: 'ease-out'
    });
  });

  document.getElementById('resetBtn').addEventListener('click', () => {
    roe.imageEffect('#island', { effect: 'reset', duration: 0.45 });
  });

  console.log('✅ Module loaded – roe.imageEffect ready');
</script>
</body>
</html>
